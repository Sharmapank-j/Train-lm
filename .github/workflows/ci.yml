name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.115.5 \
            "uvicorn[standard]==0.32.0" \
            python-multipart==0.0.27 \
            sqlalchemy==2.0.36 \
            alembic==1.13.3 \
            pydantic==2.9.2 \
            "pydantic[email]==2.9.2" \
            pydantic-settings==2.6.1 \
            "python-jose[cryptography]==3.4.0" \
            argon2-cffi==23.1.0 \
            aiofiles==24.1.0 \
            httpx==0.28.1 \
            pytest==8.3.3 \
            pytest-asyncio==0.24.0

      - name: Run tests
        run: pytest backend/tests/ tests/ -v --tb=short
        env:
          TRAIN_LM_DATABASE_URL: "sqlite:///:memory:"
          TRAIN_LM_SECRET_KEY: "ci-test-secret-key-12345"
