<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Train-LM Mock Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0b1220; color: #e2e8f0; margin: 0; }
      .wrap { max-width: 860px; margin: 40px auto; padding: 24px; }
      .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      .pill { display: inline-block; border-radius: 999px; background: #1d4ed8; padding: 4px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Train-LM</h1>
      <span class="pill">Offline-first</span>
      <div class="card"><strong>Dataset Pipeline</strong><div>Upload, validate, preprocess, version</div></div>
      <div class="card"><strong>Training Engine</strong><div>LoRA/QLoRA jobs with checkpoints and metrics</div></div>
      <div class="card"><strong>Inference</strong><div>Local llama.cpp/Ollama with streaming chat</div></div>
    </div>
  </body>
</html>
