version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./datasets:/app/datasets
      - ./models:/app/models
      - ./exports:/app/exports
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
