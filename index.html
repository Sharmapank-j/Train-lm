<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train-LM</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0f17;
        color: #f6f7f9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      main {
        max-width: 720px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      h1 {
        font-size: 2.5rem;
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 16px;
        color: rgba(246, 247, 249, 0.85);
      }

      a {
        color: #7dd3fc;
        text-decoration: none;
      }

      a:hover,
      a:focus {
        text-decoration: underline;
      }

      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        border-radius: 999px;
        background: #38bdf8;
        color: #0b0f17;
        font-weight: 600;
      }

      .cta:hover,
      .cta:focus {
        background: #0ea5e9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Train-LM</h1>
      <p>
        This placeholder page is deployed so the repository can be hosted on Netlify immediately.
        The full React UI lives in <code>frontend/</code> and can be deployed by publishing
        <code>frontend/dist</code>.
      </p>
      <p>
        Learn more about the project in the
        <a href="https://github.com/Sharmapank-j/Train-LM">GitHub repository</a>.
      </p>
      <a class="cta" href="https://github.com/Sharmapank-j/Train-LM">View on GitHub</a>
    </main>
  </body>
</html>
